<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ichiban Run - Layar</title>
<style>
  :root { --primary: #d71920; --accent: #ffc400; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .hidden { display: none !important; }
  .ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .dim { background: linear-gradient(90deg, rgba(0,0,0,.62), rgba(0,0,0,.25) 55%, rgba(0,0,0,.55)); }
  .card { background: rgba(10,12,24,.82); backdrop-filter: blur(6px); border: 2px solid rgba(255,255,255,.12); border-radius: 2.2vh; box-shadow: 0 2vh 6vh rgba(0,0,0,.5); }

  /* layar QR */
  .idle { display: grid; grid-template-columns: 1.05fr .95fr; gap: 3vw; width: 100%; height: 100%; padding: 5vh 4vw; align-items: center; }
  .brand { display: flex; align-items: center; gap: 1.5vw; }
  .brand img { height: 9vh; }
  .title { font-size: 9vh; font-weight: 900; line-height: .95; letter-spacing: -.02em; text-transform: uppercase;
           color: #fff; text-shadow: 0 .6vh 0 var(--primary), 0 1.2vh 2vh rgba(0,0,0,.5); }
  .sub { font-size: 3vh; margin-top: 1.5vh; opacity: .95; text-shadow: 0 2px 6px rgba(0,0,0,.7); max-width: 46vw; }
  .join { display: flex; gap: 2.5vw; align-items: center; margin-top: 4vh; padding: 2.5vh 2vw; }
  .qr { background: #fff; padding: 1.2vh; border-radius: 1.6vh; }
  .qr img { width: 30vh; height: 30vh; display: block; }
  .steps { font-size: 2.6vh; line-height: 1.5; }
  .steps b { color: var(--accent); }
  .scan { font-size: 4vh; font-weight: 900; color: var(--accent); margin-bottom: 1vh; }
  .keys { display: flex; gap: 1vw; margin-top: 1.8vh; }
  .key { background: var(--primary); border-radius: 1.2vh; padding: 1vh 1.4vw; font-weight: 800; font-size: 2.4vh; box-shadow: 0 .5vh 0 rgba(0,0,0,.4); }
  .url { font-size: 1.5vh; opacity: .55; margin-top: 1.5vh; word-break: break-all; }

  .lb { padding: 3vh 2vw; align-self: center; }
  .lb h2 { margin: 0 0 2vh; font-size: 4vh; display: flex; align-items: center; gap: 1vw; }
  .lb h2::before { content: '🏆'; }
  .row { display: grid; grid-template-columns: 6vh 1fr auto; align-items: center; gap: 1vw; padding: 1vh 1vw; border-radius: 1.2vh; font-size: 2.7vh; }
  .row:nth-child(odd) { background: rgba(255,255,255,.06); }
  .row .rk { width: 5vh; height: 5vh; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: rgba(255,255,255,.15); }
  .row.r1 .rk { background: #ffcf33; color: #4a3500; } .row.r2 .rk { background: #d9dde3; color: #333; } .row.r3 .rk { background: #e09a5a; color: #3b1d00; }
  .row .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .nm small { display: block; font-weight: 400; opacity: .6; font-size: 1.8vh; }
  .row .sc { font-weight: 900; color: var(--accent); font-size: 3.2vh; }
  .row.me { outline: .4vh solid var(--accent); background: rgba(255,196,0,.18); }
  .empty { opacity: .7; font-size: 2.6vh; padding: 2vh 0; }
  .footer { position: fixed; left: 0; right: 0; bottom: 1.6vh; text-align: center; font-size: 2vh; opacity: .8; text-shadow: 0 2px 4px #000; }

  /* pesan tengah */
  .msg { padding: 5vh 5vw; text-align: center; max-width: 80vw; }
  .msg .big { font-size: 7vh; font-weight: 900; }
  .msg .hint { font-size: 3.2vh; opacity: .9; margin-top: 2vh; }
  .msg img.sprite { height: 30vh; margin: 2vh auto 0; display: block; filter: drop-shadow(0 2vh 2vh rgba(0,0,0,.5)); animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2vh) rotate(-4deg); } }
  .pulse { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { transform: scale(1.06); } }
  .dots::after { content: ''; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: '' } 25% { content: '.' } 50% { content: '..' } 75% { content: '...' } }

  /* hasil */
  .result { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; padding: 4vh 3vw; width: min(92vw, 170vh); align-items: center; }
  .go { font-size: 9vh; font-weight: 900; color: var(--accent); text-shadow: 0 .6vh 0 var(--primary); }
  .reason { font-size: 2.6vh; opacity: .8; }
  .final { font-size: 15vh; font-weight: 900; line-height: 1; margin-top: 2vh; }
  .final small { display: block; font-size: 2.6vh; font-weight: 600; opacity: .7; letter-spacing: .2em; }
  .stats { display: flex; gap: 2vw; margin-top: 2vh; font-size: 3vh; }
  .badge { display: inline-block; margin-top: 2.5vh; background: var(--primary); padding: 1.2vh 2vw; border-radius: 99px; font-size: 3.4vh; font-weight: 900; }
  .next { font-size: 2vh; opacity: .6; margin-top: 2vh; }

  .tools { position: fixed; top: 10px; right: 12px; display: flex; gap: 8px; z-index: 5; }
  .tools button { pointer-events: auto; font: inherit; font-size: 12px; padding: 6px 10px; border: 0; border-radius: 8px; background: rgba(0,0,0,.45); color: #fff; cursor: pointer; }
  .status { position: fixed; bottom: 6px; right: 10px; font-size: 11px; opacity: .45; }
  @media (max-aspect-ratio: 4/3) { .idle { grid-template-columns: 1fr; } .result { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="s-qr" class="ov dim">
  <div class="idle">
    <div>
      <div class="brand"><img id="logo" class="hidden" alt=""><div class="title" id="title">ICHIBAN RUN</div></div>
      <div class="sub" id="sub"></div>
      <div class="join card">
        <div class="qr"><img id="qr" alt="QR code"></div>
        <div class="steps">
          <div class="scan">SCAN &amp; MAIN!</div>
          1. Scan QR dengan kamera HP<br>
          2. Isi nama, pilih kaleng<br>
          3. HP jadi <b>stik kontrol</b>
          <div class="keys"><span class="key">▲ UP lompat</span><span class="key">▼ DOWN merunduk</span></div>
          <div class="url" id="url"></div>
        </div>
      </div>
    </div>
    <div class="lb card"><h2>Papan Skor</h2><div id="lb"></div></div>
  </div>
</div>

<div id="s-form" class="ov dim hidden">
  <div class="msg card"><div class="big dots">Peserta sedang mendaftar</div><div class="hint">Siap-siap, sebentar lagi mulai!</div></div>
</div>

<div id="s-ready" class="ov dim hidden">
  <div class="msg card">
    <div class="big">Halo, <span id="pname"></span>!</div>
    <img class="sprite" id="psprite" alt="">
    <div class="hint pulse">Tekan tombol <b>MULAI</b> di HP kamu</div>
  </div>
</div>

<div id="s-over" class="ov dim hidden">
  <div class="result card">
    <div>
      <div class="go">GAME OVER</div>
      <div class="reason" id="oreason"></div>
      <div class="final"><small>SKOR</small><span id="oscore">0</span></div>
      <div class="stats"><span>📏 <b id="odist">0</b> m</span><span>★ <b id="ocoins">0</b></span></div>
      <div class="badge" id="orank"></div>
      <div class="next" id="onext"></div>
    </div>
    <div class="lb"><h2>Papan Skor</h2><div id="lb2"></div></div>
  </div>
</div>

<div class="footer" id="footer"></div>
<div class="tools"><button id="soundBtn">🔊 Aktifkan suara</button><button id="fsBtn">⛶ Layar penuh</button></div>
<div class="status" id="status">menghubungkan…</div>

<script src="socket.io/socket.io.js"></script>
<script src="game.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const socket = io({ path: location.pathname.replace(/\/[^/]*$/, '') + '/socket.io' });
  let branding = {};
  let myPlayName = null;
  let holdTimer = null;

  const game = window.game = new RunnerGame($('cv'), {
    onRunning: () => socket.emit('game:running'),
    onTick: (d) => socket.emit('game:tick', d),
    onHit: (d) => socket.emit('game:hit', d),
    onOver: (res) => socket.emit('game:over', res),
  });

  function show(id) {
    for (const v of ['s-qr', 's-form', 's-ready', 's-over']) $(v).classList.toggle('hidden', v !== id);
    $('footer').classList.toggle('hidden', !(id === 's-qr'));
    document.querySelector('.tools').classList.toggle('hidden', id !== 's-qr');
  }

  function applyBranding(b) {
    branding = b;
    game.setBranding(b);
    document.documentElement.style.setProperty('--primary', b.primaryColor);
    document.documentElement.style.setProperty('--accent', b.accentColor);
    $('title').textContent = b.title;
    $('sub').textContent = b.subtitle;
    $('footer').textContent = b.footer;
    document.title = b.title + ' - Layar';
    $('logo').classList.toggle('hidden', !b.logo);
    if (b.logo) $('logo').src = b.logo;
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function renderLb(el, list, meName, meRank) {
    if (!list.length) { el.innerHTML = '<div class="empty">Belum ada skor. Jadilah yang pertama!</div>'; return; }
    el.innerHTML = list.map((r) => `<div class="row r${r.rank} ${meRank && r.rank === meRank ? 'me' : ''}">
      <div class="rk">${r.rank}</div><div class="nm">${esc(r.name)}<small>${esc(r.phone || '')} · ${r.distance ?? 0} m</small></div><div class="sc">${r.score.toLocaleString('id-ID')}</div></div>`).join('');
  }

  socket.on('connect', () => { $('status').textContent = 'terhubung'; socket.emit('screen:hello'); });
  socket.on('disconnect', () => { $('status').textContent = 'koneksi terputus, mencoba lagi…'; });

  socket.on('branding', applyBranding);
  socket.on('screen:qr', ({ qr, url, branding: b, leaderboard }) => {
    clearInterval(holdTimer);
    applyBranding(b);
    $('qr').src = qr; $('url').textContent = url;
    renderLb($('lb'), leaderboard);
    if (game.mode !== 'idle') game.startIdle();
    show('s-qr');
  });
  socket.on('leaderboard', (lb) => renderLb($('lb'), lb));
  socket.on('screen:form', () => show('s-form'));
  socket.on('screen:ready', ({ name, sprite }) => {
    $('pname').textContent = name;
    $('psprite').src = sprite.src;
    show('s-ready');
  });
  socket.on('game:start', (cfg) => {
    myPlayName = cfg.name;
    applyKeyboard(cfg.keyboardOnTv);
    show(null);
    game.start(cfg);
  });
  socket.on('ctl', ({ k, d }) => game.input(k, d));
  socket.on('game:forceEnd', () => game.forceEnd());
  socket.on('game:result', (r) => {
    setTimeout(() => {
      $('oscore').textContent = r.score.toLocaleString('id-ID');
      $('odist').textContent = r.distance;
      $('ocoins').textContent = r.coins;
      $('oreason').textContent = `${r.name} · ` + ({ nyawa: 'Nyawa habis', waktu: 'Waktu habis', admin: 'Dihentikan admin' }[r.reason] || '');
      $('orank').textContent = r.test ? 'Uji coba · tidak masuk papan skor' : r.rank ? `Peringkat #${r.rank}` : 'Skor terbaikmu masih lebih tinggi!';
      renderLb($('lb2'), r.leaderboard, r.name, r.rank);
      show('s-over');
      let left = (r.holdSec || 12) - 1;
      clearInterval(holdTimer);
      const tick = () => { $('onext').textContent = `QR untuk peserta berikutnya muncul dalam ${Math.max(0, left)} detik`; left--; };
      tick(); holdTimer = setInterval(tick, 1000);
    }, 900);
  });

  // Keyboard di TV (untuk uji coba tanpa HP)
  let kbOn = true;
  function applyKeyboard(on) { kbOn = on !== false; }
  const keyMap = { ArrowUp: 'up', ' ': 'up', w: 'up', ArrowDown: 'down', s: 'down' };
  addEventListener('keydown', (e) => { const k = keyMap[e.key]; if (k && kbOn && game.mode !== 'idle') { e.preventDefault(); if (!e.repeat) game.input(k, true); } });
  addEventListener('keyup', (e) => { const k = keyMap[e.key]; if (k && kbOn) game.input(k, false); });

  $('soundBtn').onclick = () => { RunnerSfx.unlock(); $('soundBtn').textContent = '🔊 Suara aktif'; };
  $('fsBtn').onclick = () => { RunnerSfx.unlock(); document.documentElement.requestFullscreen?.(); };
  addEventListener('click', () => RunnerSfx.unlock(), { once: true });
</script>
</body>
</html>
